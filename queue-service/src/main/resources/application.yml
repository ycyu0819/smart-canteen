server:
  port: 8084

spring:
  application:
    name: queue-service
  datasource:
    url: jdbc:mysql://localhost:3306/canteen_queue?useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848

queue:
  repeat-call-interval-seconds: 30
